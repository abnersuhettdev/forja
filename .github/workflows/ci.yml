# CI de verificação (ADR-075, PLN-01 TAR-001). Etapas de teste, deploy e backup entram nas
# tarefas seguintes. Actions fixadas por hash de commit (SEG-01 AM-11).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacoes:
    name: Tipos, lint, formatação, licenças, catálogo e dependências
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Testes de unidade com metas de cobertura (RNF-021)
        run: pnpm test
      - run: pnpm licenses:check
      - name: Catálogo curado (DAD-06 §4)
        run: pnpm catalog:check
      - name: Auditoria de dependências (falha em vulnerabilidade alta ou crítica)
        run: pnpm audit --audit-level high

  e2e:
    name: Ponta a ponta e acessibilidade (Chromium e WebKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supabase local, configuração do app e usuários fictícios (ADR-090)
        run: |
          node scripts/db/local-sync-role.ts --env
          pnpm exec supabase start -x studio,imgproxy,mailpit,realtime,storage-api,logflare,vector
          node scripts/db/local-sync-role.ts --apply
          node scripts/db/write-local-env.ts
      - name: Navegadores do Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Testes de ponta a ponta
        working-directory: apps/web
        run: pnpm exec playwright test

  banco:
    name: Banco — migrações do zero e testes de políticas (DAD-07 §2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supabase local (aplica as migrações em banco limpo)
        run: |
          node scripts/db/local-sync-role.ts --env
          pnpm exec supabase start -x studio,imgproxy,mailpit,realtime,storage-api,logflare,vector
          node scripts/db/local-sync-role.ts --apply
          node scripts/db/write-local-env.ts
      - name: Testes de banco (pgTAP) e da função de sincronização (cobertura ≥ 80%)
        run: |
          pnpm exec supabase test db
          pnpm exec vitest run -c vitest.integration.config.ts --coverage

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
