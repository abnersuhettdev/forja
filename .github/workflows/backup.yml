# Backup diário criptografado (IMP-03 §1, ADR-073). Também chamado pelo deploy de produção antes
# das migrações (IMP-02, passo P1). O executor só cifra, com a chave PÚBLICA `age`; somente a
# chave privada do usuário decifra. Segredos e variáveis do ambiente "producao" entram na TAR-003.
name: Backup

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Cópia lógica cifrada com soma de verificação
    runs-on: ubuntu-24.04
    environment: producao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exportar e cifrar (papéis, esquema, dados, histórico de migrações)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: node scripts/ops/backup.ts --out backup
      - name: Guardar por 35 dias (RNF-011)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-${{ github.run_id }}
          path: backup/
          retention-days: 35
          if-no-files-found: error
